[package]
name = "totaldrop-windows-bridge"
description = "Pure-Rust Windows 11 bridge over totaldrop-core, totaldrop-proto, and totaldrop-l10n for WinUI 3 and IExplorerCommand"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
icu_locale = "2.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "net", "rt", "sync", "time"] }
totaldrop-core = { version = "0.2.0-beta.5", path = "../totaldrop-core" }
totaldrop-l10n = { version = "0.2.0-beta.5", path = "../totaldrop-l10n" }
totaldrop-proto = { version = "0.2.0-beta.5", path = "../totaldrop-proto" }

[lints]
workspace = true
